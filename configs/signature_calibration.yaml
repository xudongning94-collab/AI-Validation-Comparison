signature_calibration:
  # D13.3 calibration parameters. Thresholds are selected on the calibration
  # split, then measured without retuning on the validation split.
  iou_threshold: 0.30
  minimum_recall: 0.85
  confidence_thresholds:
    - 0.35
    - 0.45
    - 0.55
    - 0.65
    - 0.75
    - 0.85
  required_kinds:
    - signature
    - seal
